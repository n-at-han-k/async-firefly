services:
  firefly:
    image: fireflyiii/core:version-6.7.8
    ports:
      - "127.0.0.1:${FIREFLY_PORT:-8081}:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: async-firefly-test-key-012345678
      APP_URL: "http://localhost:${FIREFLY_PORT:-8081}"
      SITE_OWNER: tester@example.com
      TRUSTED_PROXIES: "**"

      DB_CONNECTION: sqlite

      MAIL_MAILER: log
      ENABLE_EXTERNAL_MAP: "false"
      ENABLE_EXTERNAL_RATES: "false"
      SEND_REGISTRATION_MAIL: "false"
      SEND_ERROR_MESSAGE: "false"
      SEND_LOGIN_NEW_IP_WARNING: "false"

      TZ: UTC
    volumes:
      - firefly-upload:/var/www/html/storage/upload
      - firefly-database:/var/www/html/storage/database
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8080/api/v1/about') === false ? 1 : 0);"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 60s

volumes:
  firefly-upload:
  firefly-database:
